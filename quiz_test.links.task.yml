# Tab for edit-form page (primary tab).
quiz_test.test_edit_tab:
  route_name: entity.quiz_test.edit_form
  title: 'Редактировать'
  base_route: entity.quiz_test.edit_form

# Tab for questions list on the same edit-form page.
quiz_test.test_questions_tab:
  route_name: quiz_test.question_list
  title: 'Вопросы'
  base_route: entity.quiz_test.edit_form
  weight: 1

# Tab for open questions list (optional second part).
quiz_test.open_questions_tab:
  route_name: quiz_test.open_question_list
  title: 'Открытые вопросы'
  base_route: entity.quiz_test.edit_form
  weight: 2

# Tab for settings page.
quiz_test.settings_tab:
  route_name: quiz_test.settings
  title: 'Настройки'
  base_route: quiz_test.settings

# Default tab on the tests collection page.
entity.quiz_test.collection_default_tab:
  route_name: entity.quiz_test.collection
  base_route: entity.quiz_test.collection
  title: 'Тесты'

# Results log tab on the same collection page.
quiz_test.results_tab:
  route_name: quiz_test.results
  title: 'Результаты'
  base_route: entity.quiz_test.collection
  weight: 1
